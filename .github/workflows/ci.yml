name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production bundle)
        run: npm run build

      - name: Unit + component + artifact tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: E2E smoke suite (production build)
        run: node scripts/e2e.mjs
